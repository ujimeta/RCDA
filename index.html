<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahama Community Development Association (RCDA) | Kano State</title>
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --rcda-green: #0F4C3A;
            --rcda-dark-green: #082E22;
            --accent-gold: #F4B41A;
            --text-main: #222222;
            --text-light: #555555;
            --bg-light: #F7F9F8;
            --white: #FFFFFF;
        }

        body {
            color: var(--text-main);
            background-color: var(--white);
            line-height: 1.6;
        }

        /* Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid #E5E5E5;
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 1000;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--rcda-green);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            background: var(--rcda-green);
            color: var(--accent-gold);
            padding: 6px 10px;
            font-weight: 900;
            border-radius: 4px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--rcda-green);
        }

        /* Dropdown Styling */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--white);
            min-width: 180px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            border-radius: 4px;
            padding: 10px 0;
            z-index: 1100;
            border: 1px solid #E5E5E5;
        }

        .dropdown-content li {
            width: 100%;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 10px 20px;
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .dropdown-content a:hover {
            background-color: var(--bg-light);
            color: var(--rcda-green);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .btn-action {
            background-color: var(--accent-gold);
            color: var(--rcda-dark-green);
            padding: 12px 22px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #dda212;
        }

        /* Mobile Menu Toggle Button */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: var(--rcda-green);
            border-radius: 2px;
            transition: 0.3s;
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            min-height: 75vh;
            background-color: var(--rcda-green);
            color: var(--white);
        }

        .hero-content {
            padding: 80px 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-content h1 {
            font-size: 3.2rem;
            line-height: 1.15;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .hero-content h1 span {
            color: var(--accent-gold);
        }

        .hero-content p {
            font-size: 1.15rem;
            color: #E2ECE9;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-secondary {
            border: 2px solid var(--white);
            color: var(--white);
            padding: 10px 22px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .btn-secondary:hover {
            background: var(--white);
            color: var(--rcda-green);
        }

        .hero-image {
            background: url('https://images.unsplash.com/photo-1532629345422-7515f3d16bb9?auto=format&fit=crop&q=80&w=1000') center/cover no-repeat;
        }

        /* Quick Info Bar */
        .info-bar {
            background-color: var(--accent-gold);
            color: var(--rcda-dark-green);
            padding: 20px 5%;
            display: flex;
            justify-content: space-around;
            text-align: center;
            font-weight: 700;
