<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahama Community Development Association (RCDA) | Kano State</title>
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --rcda-green: #0F4C3A;
            --rcda-dark-green: #082E22;
            --accent-gold: #F4B41A;
            --text-main: #222222;
            --text-light: #555555;
            --bg-light: #F7F9F8;
            --white: #FFFFFF;
        }

        body {
            color: var(--text-main);
            background-color: var(--white);
            line-height: 1.6;
        }

        /* Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            border-bottom: 1px solid #E5E5E5;
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 1000;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--rcda-green);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-emblem {
            width: 44px;
            height: 44px;
            background: var(--rcda-green);
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 2px 6px rgba(15, 76, 58, 0.2);
            position: relative;
            overflow: hidden;
        }

        .logo-emblem::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 16px;
            height: 4px;
            background: var(--accent-gold);
            border-radius: 2px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .logo-text span:first-child {
            font-size: 1.1rem;
            color: var(--rcda-dark-green);
            font-weight: 900;
        }

        .logo-text span:last-child {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--rcda-green);
        }

        /* Dropdown Styling */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--white);
            min-width: 180px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            border-radius: 4px;
            padding: 10px 0;
            z-index: 1100;
            border: 1px solid #E5E5E5;
        }

        .dropdown-content li {
            width: 100%;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 10px 20px;
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .dropdown-content a:hover {
            background-color: var(--bg-light);
            color: var(--rcda-green);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .btn-action {
            background-color: var(--accent-gold);
            color: var(--rcda-dark-green);
            padding: 12px 22px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #dda212;
        }

        /* Mobile Menu Toggle Button */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: var(--rcda-green);
            border-radius: 2px;
            transition: 0.3s;
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            min-height: 75vh;
            background-color: var(--rcda-green);
            color: var(--white);
        }

        .hero-content {
            padding: 80px 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-content h1 {
            font-size: 3.2rem;
            line-height: 1.15;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .hero-content h1 span {
            color: var(--accent-gold);
        }

        .hero-content p {
            font-size: 1.15rem;
            color: #E2ECE9;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-secondary {
            border: 2px solid var(--white);
            color: var(--white);
            padding: 10px 22px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .btn-secondary:hover {
            background: var(--white);
            color: var(--rcda-green);
        }

        .hero-image {
            background: url('https://images.unsplash.com/photo-1532629345422-7515f3d16bb9?auto=format&fit=crop&q=80&w=1000') center/cover no-repeat;
        }

        /* Quick Info Bar */
        .info-bar {
            background-color: var(--accent-gold);
            color: var(--rcda-dark-green);
            padding: 20px 5%;
            display: flex;
            justify-content: space-around;
            text-align: center;
            font-weight: 700;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Sections General Padding */
        section {
            scroll-margin-top: 90px;
        }

        /* Content Sections */
        .content-section {
            padding: 90px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .content-section h2 {
            font-size: 2.3rem;
            color: var(--rcda-dark-green);
            margin-bottom: 20px;
            font-weight: 800;
        }
        .content-section p {
            color: var(--text-light);
            font-size: 1.05rem;
            margin-bottom: 15px;
        }

        .alt-bg {
            background-color: var(--bg-light);
            max-width: 100%;
        }

        .alt-bg-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Thematic Focus Areas Grid */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: var(--white);
            padding: 35px 25px;
            border-top: 4px solid var(--rcda-green);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            text-align: left;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-color: var(--accent-gold);
        }

        .card-icon {
            font-size: 2.4rem;
            margin-bottom: 15px;
            line-height: 1;
        }

        .card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--rcda-dark-green);
            margin-bottom: 12px;
        }

        .card p {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .card-link {
            font-weight: 700;
            color: var(--rcda-green);
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Model Section */
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .model-card {
            background: var(--white);
            padding: 25px 20px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-gold);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .model-card h4 {
            color: var(--rcda-dark-green);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .model-card p {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* Partnerships Section */
        .partners-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
        }
        .partner-badge {
            background: var(--white);
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: 600;
            color: var(--rcda-dark-green);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #E5E5E5;
        }

        /* Footer / Contact Section */
        footer {
            background-color: var(--rcda-dark-green);
            color: var(--white);
            padding: 60px 5% 30px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 40px;
        }

        .footer-col h4 {
            color: var(--accent-gold);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .footer-col p, .footer-col ul li a {
            color: #CCCCCC;
            font-size: 0.95rem;
            text-decoration: none;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 10px;
        }

        .footer-col ul li a:hover {
            color: var(--white);
        }

        .footer-bottom {
            text-align: center;
            color: #999999;
            font-size: 0.85rem;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
            }
            .hero-image {
                min-height: 280px;
            }
            .hero-content h1 {
                font-size: 2.4rem;
            }
            
            .menu-toggle {
                display: flex;
            }
            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 80px;
                left: 0;
                width: 100%;
                background: var(--white);
                padding: 20px 0;
                border-bottom: 1px solid #E5E5E5;
                box-shadow: 0 10px 20px rgba(0,0,0,0.05);
                text-align: center;
            }
            nav ul.active {
                display: flex;
            }
            nav ul li {
                width: 100
