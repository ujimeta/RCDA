<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rahama Community Development Association (RCDA) | Kano State</title>

    <style>

        /* =========================================================
           GLOBAL RESET & VARIABLES
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --rcda-green: #0F4C3A;
            --rcda-dark-green: #082E22;
            --accent-gold: #F4B41A;

            --text-main: #222222;
            --text-light: #555555;

            --bg-light: #F7F9F8;
            --white: #FFFFFF;
        }

        body {
            color: var(--text-main);
            background-color: var(--white);
            line-height: 1.6;
        }


        /* =========================================================
           HEADER / NAVIGATION
        ========================================================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 5%;

            border-bottom: 1px solid #E5E5E5;

            position: sticky;
            top: 0;

            background: var(--white);

            z-index: 1000;
        }


        /* Official RCDA Logo */

        .logo {
            display: flex;
            align-items: center;

            text-decoration: none;

            flex-shrink: 0;
        }

        .logo img {
            display: block;

            width: auto;
            height: 58px;

            max-width: 180px;

            object-fit: contain;
        }


        /* =========================================================
           NAVIGATION
        ========================================================= */

        nav ul {
            display: flex;

            list-style: none;

            gap: 25px;

            align-items: center;
        }

        nav a {
            text-decoration: none;

            color: var(--text-main);

            font-weight: 600;

            font-size: 0.95rem;

            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--rcda-green);
        }


        /* =========================================================
           ABOUT US DROPDOWN
        ========================================================= */

        .dropdown {
            position: relative;
        }


        /*
           Invisible bridge between the About Us button
           and the dropdown.

           This prevents the menu from disappearing when
           the cursor moves downward into the submenu.
        */

        .dropdown::after {
            content: "";

            position: absolute;

            left: 0;
            top: 100%;

            width: 100%;
            height: 10px;
        }


        .dropdown-content {
            display: none;

            position: absolute;

            top: calc(100% + 8px);
            left: 0;

            background-color: var(--white);

            min-width: 190px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);

            border-radius: 6px;

            padding: 8px 0;

            z-index: 1100;

            border: 1px solid #E5E5E5;
        }


        /*
           Dropdown stays open when cursor is anywhere
           over the About Us area or when focused.
        */

        .dropdown:hover .dropdown-content,
        .dropdown:focus-within .dropdown-content {
            display: block;
        }


        .dropdown-content a {
            color: var(--text-main);

            padding: 11px 20px;

            display: block;

            font-size: 0.9rem;

            font-weight: 500;

            white-space: nowrap;

            text-decoration: none;
        }

        .dropdown-content a:hover {
            background-color: var(--bg-light);

            color: var(--rcda-green);
        }


        /* =========================================================
           ACTION BUTTON
        ========================================================= */

        .btn-action {
            background-color: var(--accent-gold);

            color: var(--rcda-dark-green);

            padding: 12px 22px;

            font-weight: 700;

            text-decoration: none;

            border-radius: 4px;

            transition: background-color 0.2s ease;
        }

        .btn-action:hover {
            background-color: #DDA212;
        }


        /* =========================================================
           MOBILE MENU BUTTON
        ========================================================= */

        .menu-toggle {
            display: none;

            flex-direction: column;

            cursor: pointer;

            gap: 5px;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;

            background-color: var(--rcda-green);

            border-radius: 2px;

            transition: 0.3s;
        }


        /* =========================================================
           HERO SECTION
        ========================================================= */

        .hero {
            display: grid;

            grid-template-columns: 1.2fr 0.8fr;

            min-height: 75vh;

            background-color: var(--rcda-green);

            color: var(--white);
        }

        .hero-content {
            padding: 80px 10%;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .hero-content h1 {
            font-size: 3.2rem;

            line-height: 1.15;

            margin-bottom: 20px;

            font-weight: 800;
        }

        .hero-content h1 span {
            color: var(--accent-gold);
        }

        .hero-content p {
            font-size: 1.15rem;

            color: #E2ECE9;

            margin-bottom: 30px;

            max-width: 700px;
        }

        .hero-buttons {
            display: flex;

            gap: 15px;

            flex-wrap: wrap;
        }


        /* Secondary Button */

        .btn-secondary {
            border: 2px solid var(--white);

            color: var(--white);

            padding: 10px 22px;

            text-decoration: none;

            font-weight: 600;

            border-radius: 4px;

            transition: background 0.2s ease,
                        color 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--white);

            color: var(--rcda-green);
        }


        /* Hero Image */

        .hero-image {
            background:
                url("https://images.unsplash.com/photo-1532629345422-7515f3d16bb9?auto=format&fit=crop&q=80&w=1000")
                center / cover no-repeat;
        }


        /* =========================================================
           INFORMATION BAR
        ========================================================= */

        .info-bar {
            background-color: var(--accent-gold);

            color: var(--rcda-dark-green);

            padding: 20px 5%;

            display: flex;

            justify-content: space-around;

            text-align: center;

            font-weight: 700;

            flex-wrap: wrap;

            gap: 20px;
        }


        /* =========================================================
           GENERAL SECTION SETTINGS
        ========================================================= */

        section {
            scroll-margin-top: 90px;
        }

        .content-section {
            padding: 90px 5%;

            max-width: 1200px;

            margin: 0 auto;
        }

        .content-section h2 {
            font-size: 2.3rem;

            color: var(--rcda-dark-green);

            margin-bottom: 20px;

            font-weight: 800;
        }

        .content-section p {
            color: var(--text-light);

            font-size: 1.05rem;

            margin-bottom: 15px;
        }

        .alt-bg {
            background-color: var(--bg-light);

            max-width: 100%;
        }

        .alt-bg-inner {
            max-width: 1200px;

            margin: 0 auto;
        }


        /* =========================================================
           FOUNDER'S WELCOME
        ========================================================= */

        .founder-section {
            background: var(--white);

            padding: 85px 5%;
        }

        .founder-inner {
            max-width: 1000px;

            margin: 0 auto;

            text-align: center;
        }

        .founder-inner h2 {
            color: var(--rcda-dark-green);

            font-size: 2.2rem;

            margin-bottom: 25px;

            font-weight: 800;
        }

        .founder-message {
            max-width: 850px;

            margin: 0 auto;

            color: var(--text-light);

            font-size: 1.08rem;

            line-height: 1.8;
        }

        .founder-signature {
            margin-top: 25px;

            color: var(--rcda-green);

            font-weight: 700;

            font-size: 1rem;
        }


        /* =========================================================
           THEMATIC FOCUS AREAS
        ========================================================= */

        .grid-4 {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 25px;

            margin-top: 30px;
        }

        .card {
            background: var(--white);

            padding: 35px 25px;

            border-top: 4px solid var(--rcda-green);

            box-shadow: 0 4px 15px rgba(0,0,0,0.04);

            text-align: left;

            border-radius: 4px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            text-decoration: none;

            color: inherit;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);

            box-shadow: 0 8px 20px rgba(0,0,0,0.08);

            border-color: var(--accent-gold);
        }

        .card-icon {
            font-size: 2.4rem;

            margin-bottom: 15px;

            line-height: 1;
        }

        .card h3 {
            font-size: 1.25rem;

            font-weight: 700;

            color: var(--rcda-dark-green);

            margin-bottom: 12px;
        }

        .card p {
            color: var(--text-light);

            font-size: 0.95rem;

            margin-bottom: 20px;
        }

        .card-link {
            font-weight: 700;

            color: var(--rcda-green);

            font-size: 0.9rem;

            display: inline-flex;

            align-items: center;

            gap: 5px;
        }


        /* =========================================================
           OUR COMMUNITY-CENTERED MODEL
        ========================================================= */

        .model-section {
            position: relative;

            overflow: hidden;
        }

        .model-intro {
            max-width: 850px;

            margin: 0 auto 45px;

            text-align: center;
        }

        .model-intro h2 {
            margin-bottom: 12px;
        }

        .model-intro p {
            color: var(--text-light);

            font-size: 1.05rem;

            line-height: 1.7;

            margin: 0;
        }


        /* Model cards */

        .model-pathway {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 18px;

            position: relative;

            max-width: 1200px;

            margin: 0 auto;
        }

        .model-step {
            position: relative;

            background: #FFFFFF;

            border-radius: 14px;

            padding: 28px 22px;

            min-height: 220px;

            border: 1px solid rgba(0,0,0,0.06);

            box-shadow: 0 8px 25px rgba(0,0,0,0.06);

            text-decoration: none;

            color: inherit;

            display: flex;

            flex-direction: column;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .model-step:hover {
            transform: translateY(-6px);

            box-shadow: 0 14px 32px rgba(0,0,0,0.10);

            border-color: var(--accent-gold);
        }


        /* Representative pictorial symbols */

        .model-icon {
            width: 58px;

            height: 58px;

            border-radius: 50%;

            background: var(--bg-light);

            border: 2px solid var(--accent-gold);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1.8rem;

            margin-bottom: 18px;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        .model-step:hover .model-icon {
            transform: scale(1.08);

            background: #FFF8E5;
        }
